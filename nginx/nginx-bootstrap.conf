# HTTP-only nginx config used ONLY for the very first certbot run.
# After certs exist, docker-compose switches back to nginx/nginx.conf.

server {
    listen 80;
    server_name vatanict.tj www.vatanict.tj _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
