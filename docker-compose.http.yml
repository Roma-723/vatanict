# HTTP-only stack — use this before SSL certs exist.
# Switch to docker-compose.yml after running init-letsencrypt.sh.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-}
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-http.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_SECRET: ${ADMIN_SECRET:-vatan-ict-change-this-secret}
    volumes:
      - submissions_data:/app/data
    restart: unless-stopped

volumes:
  submissions_data:
  certbot_www:
